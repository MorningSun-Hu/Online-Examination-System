<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考场试卷</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          repeating-linear-gradient(
            90deg,
            #6d4b2d 0 18px,
            #7a5534 18px 20px
          );
        font-family: "Noto Sans SC", "Literata", serif;
        color: #2a2118;
      }
      #app {
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 16px 80px;
      }
      .sheet {
        background: #f7f1e1;
        background-image: repeating-linear-gradient(
          #f7f1e1,
          #f7f1e1 31px,
          #ead9b4 32px
        );
        border-radius: 4px 18px 8px 4px;
        padding: 36px 34px 48px;
        box-shadow: 12px 16px 0 rgba(40, 24, 8, 0.28);
        position: relative;
      }
      .sheet::before {
        content: "";
        position: absolute;
        left: 46px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #d45d4c;
        opacity: 0.55;
      }
      h1 {
        font-family: "Literata", "Noto Serif SC", serif;
        margin: 0 0 8px 24px;
      }
      .meta {
        margin-left: 24px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        color: #6a4e32;
      }
      label {
        display: block;
        margin: 12px 0 0 24px;
      }
      input,
      textarea,
      button,
      select {
        font: inherit;
      }
      input,
      textarea {
        width: min(420px, 100%);
        padding: 8px 10px;
        border: 1px solid #b89a6a;
        background: #fffaf0;
        border-radius: 6px;
      }
      button {
        margin: 16px 0 0 24px;
        background: #8c1d18;
        color: #f7f1e1;
        border: 0;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: #8c1d18;
        border: 1px solid #8c1d18;
      }
      .q {
        margin: 22px 0 22px 24px;
        padding-bottom: 12px;
      }
      .q h3 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }
      .opt {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 6px 0;
      }
      .err {
        margin: 12px 24px;
        color: #8c1d18;
        font-weight: 600;
      }
      .stamp {
        position: absolute;
        right: 28px;
        top: 28px;
        border: 4px solid #8c1d18;
        color: #8c1d18;
        padding: 8px 12px;
        transform: rotate(12deg);
        font-family: "Literata", serif;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      .ok {
        color: #2f6b45;
      }
      .bad {
        color: #8c1d18;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/student/main.ts"></script>
  </body>
</html>
