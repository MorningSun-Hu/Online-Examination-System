<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>讲台控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+SC:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #15202b;
        --slate: #243447;
        --chalk: #f3e6c4;
        --gold: #e0b15b;
        --mint: #7ec8a3;
        --paper: #f6efe2;
        --danger: #d45d4c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 12% 8%, #2c4258 0, transparent 28%),
          linear-gradient(160deg, #101820, #1c2b3a 55%, #15202b);
        color: var(--paper);
        font-family: "Source Sans 3", "Noto Sans SC", sans-serif;
      }
      #app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      h1,
      h2,
      h3 {
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      .kicker {
        color: var(--gold);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .gate,
      .panel,
      .card {
        background: color-mix(in srgb, var(--slate) 88%, black);
        border: 1px solid color-mix(in srgb, var(--chalk) 18%, transparent);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }
      .gate {
        max-width: 420px;
        margin: 12vh auto 0;
        background: var(--paper);
        color: var(--ink);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 22px 0;
      }
      nav button,
      .btn,
      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--gold) 20%, transparent);
        color: var(--chalk);
      }
      nav button.active,
      .btn.primary,
      button.primary {
        background: var(--gold);
        color: #1b1408;
        font-weight: 600;
      }
      button.danger {
        background: var(--danger);
        color: white;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        min-width: 140px;
        flex: 1;
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #cbbd9a;
        background: #fffdf7;
        color: #1b1408;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid color-mix(in srgb, var(--chalk) 16%, transparent);
      }
      .flash {
        background: #3a2a12;
        color: var(--gold);
        padding: 10px 14px;
        border-radius: 12px;
        margin: 12px 0;
        white-space: pre-wrap;
      }
      .lan a {
        color: var(--mint);
        font-family: "IBM Plex Mono", monospace;
      }
      .grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 16px;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .q {
        background: var(--paper);
        color: var(--ink);
        padding: 12px;
        border-radius: 12px;
        margin: 10px 0;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
      .muted {
        opacity: 0.72;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/teacher/main.ts"></script>
  </body>
</html>
