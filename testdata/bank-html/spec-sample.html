<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>规范样例</title>
</head>
<body>
<h1>规范样例</h1>
<h2>试卷1：样例</h2>
<h3>一、选择题</h3>
<div class="question">
    <p>第1题 输出函数是</p>
    <div class="options">A. input()　B. print()　C. output()　D. write()</div>
    <div class="answer">答案：B</div>
</div>
<div class="question">
    <p>第2题 多选题</p>
    <div class="options">A. int　B. float　C. char　D. str</div>
    <div class="answer">答案：ABD</div>
</div>
<h3>二、判断题</h3>
<div class="question">
    <p>第3题 变量必须先声明类型</p>
    <div class="answer">答案：×</div>
</div>
<h3>三、填空题</h3>
<div class="question">
    <p>第4题 求长度用 ________</p>
    <div class="answer">答案：len()|len</div>
</div>
<h3>四、编程题</h3>
<div class="question">
    <p>第5题 输出 Hello</p>
    <div class="answer">参考答案：<br><pre>print("Hello")</pre></div>
</div>
</body>
</html>
